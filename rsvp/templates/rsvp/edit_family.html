<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Familia - Control de Invitados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen p-4 sm:p-6 flex items-center justify-center">
    <div class="max-w-xl w-full bg-white p-6 sm:p-8 rounded-2xl border border-stone-200 shadow-lg space-y-6">
        <div>
            <h1 class="text-xl font-bold text-stone-900">Editar Invitado / Familia</h1>
            <p class="text-xs text-stone-500 mt-1">Actualiza los datos o modifica los boletos asignados.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-stone-700 mb-1">Nombre / Familia:</label>
                {{ form.name }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-stone-700 mb-1">WhatsApp (10 dígitos):</label>
                {{ form.contact_phone }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-stone-700 mb-1">Boletos asignados:</label>
                {{ form.assigned_tickets }}
            </div>

            {% if family.is_locked %}
                <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 flex items-center gap-2">
                    <input type="checkbox" name="unlock_rsvp" value="1" id="unlock_rsvp" class="rounded text-amber-600 focus:ring-amber-500">
                    <label for="unlock_rsvp" class="cursor-pointer font-medium">
                        Desbloquear invitación (Permitir que la familia vuelva a confirmar o cambiar nombres)
                    </label>
                </div>
            {% endif %}

            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-stone-900 text-white py-3 rounded-xl font-medium text-sm hover:bg-stone-800 transition">
                    Guardar Cambios
                </button>
                <a href="{% url 'couples_dashboard' %}" class="bg-stone-100 text-stone-700 px-5 py-3 rounded-xl font-medium text-sm hover:bg-stone-200 transition text-center">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</body>
</html>
